<style>

<body class="bg-surface text-on-surface font-body-md overflow-hidden h-screen flex flex-col items-center justify-end">

<!-- Mock Top App Bar -->
<header class="flex justify-between items-center w-full px-screen-padding py-4 max-w-7xl mx-auto bg-surface/80 backdrop-blur-md">
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden">

</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Trackify</h1>
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</header>
<!-- Background Content (Simulated Dashboard) -->
<main class="flex-1 px-screen-padding pt-stack-lg">
<div class="w-full h-32 rounded-3xl bg-surface-container-high mb-stack-md animate-pulse"></div>
<div class="w-full h-64 rounded-3xl bg-surface-container mb-stack-md animate-pulse"></div>
</main>
</div>
<!-- Bottom Sheet Main Container -->
<div class="relative w-full max-w-2xl bg-surface-container-lowest rounded-t-[32px] shadow-[0_-12px_40px_rgba(0,0,0,0.08)] flex flex-col z-50 transform translate-y-0 transition-transform duration-500 ease-out">
<!-- Handle -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1.5 bg-outline-variant/40 rounded-full"></div>
</div>
<div class="px-screen-padding pb-10 overflow-y-auto max-h-[795px] custom-scrollbar">
<!-- Header Section -->
<div class="flex justify-between items-center mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Add Expense</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Large Amount Input -->
<div class="flex flex-col items-center justify-center py-stack-lg mb-stack-lg bg-surface-container-low rounded-[24px] border border-outline-variant/10">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Total Amount</span>
<div class="flex items-baseline gap-1">
<span class="font-display-lg text-display-lg text-primary/40">$</span>
<input class="w-full text-center font-display-lg text-display-lg text-primary bg-transparent border-none p-0 focus:ring-0" id="amount-input" placeholder="0.00" type="text" value="0.00"/>
</div>
</div>
<!-- Categories Horizontal Scroll -->
<div class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-label-md text-label-md text-on-surface">Select Category</span>
<span class="text-primary font-label-sm text-label-sm">View All</span>
</div>
<div class="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
<!-- Category: Food -->
<button class="active-chip flex items-center gap-2 px-4 py-3 bg-[#FFF3E0] text-[#E65100] rounded-2xl border border-[#FFE0B2] flex-shrink-0 transition-all active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label-md text-label-md">Food</span>
</button>
<!-- Category: Transport -->
<button class="flex items-center gap-2 px-4 py-3 bg-primary-fixed text-primary rounded-2xl border border-primary/10 flex-shrink-0 transition-all active:scale-95">
<span class="material-symbols-outlined">directions_car</span>
<span class="font-label-md text-label-md">Transport</span>
</button>
<!-- Category: Bills -->
<button class="flex items-center gap-2 px-4 py-3 bg-tertiary-fixed text-tertiary rounded-2xl border border-tertiary/10 flex-shrink-0 transition-all active:scale-95">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-md text-label-md">Bills</span>
</button>
<!-- Category: Health -->

<span class="font-label-md text-label-md">Health</span>
</button>

<textarea class="flex-1 bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline resize-none" id="notes" placeholder="Add some context..." rows="2"></textarea>
</div>
</div>

<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Date</label>

<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>

</div>
</div>
<div class="flex flex-col gap-2">

<div class="flex items-center gap-3 bg-surface-container px-4 h-[56px] rounded-2xl border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant">payments</span>
<span class="font-body-md text-body-md text-on-surface">One-time</span>

</div>

<button class="w-full h-[60px] bg-gradient-to-r from-primary to-primary-container text-on-primary font-body-lg text-body-lg rounded-2xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Save Expense
            </button>
</div>

<!-- Script for interaction -->
<script>
        // Simple input focus formatting logic
        const amountInput = document.getElementById('amount-input');
        amountInput.addEventListener('focus', () => {
            if (amountInput.value === '0.00') {
                amountInput.value = '';
            }
        });
        amountInput.addEventListener('blur', () => {
            if (amountInput.value === '') {
                amountInput.value = '0.00';
            }
        });

        // Category Selection Visual Toggle
        const categoryChips = document.querySelectorAll('.overflow-x-auto button');
        categoryChips.forEach(chip => {
            chip.addEventListener('click', () => {
                categoryChips.forEach(c => c.classList.remove('active-chip', 'ring-2', 'ring-primary/20'));
                chip.classList.add('active-chip', 'ring-2', 'ring-primary/20');
            });
        });
    </script>
</body></html>
