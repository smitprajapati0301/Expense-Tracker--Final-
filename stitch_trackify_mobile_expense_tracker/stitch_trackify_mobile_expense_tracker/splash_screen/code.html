<style>
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(150%) skewX(-20deg); }
        }
        .shimmer-effect {
            position: relative;
            overflow: hidden;
        }
        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 3s infinite;
        }
        .gradient-bg {
            background: radial-gradient(circle at center, #3B82F6 0%, #0058be 100%);
        }
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }

<!-- Interactive Micro-interaction Script -->
<script>
        // Simple scale interaction for the logo on mouse move (desktop only)
        if (window.innerWidth > 768) {
            const container = document.querySelector('main');
            const logo = document.querySelector('.float-animation');
            
            container.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            container.addEventListener('mouseenter', () => {
                logo.style.transition = 'none';
            });

            container.addEventListener('mouseleave', () => {
                logo.style.transition = 'all 0.5s ease';
                logo.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
        }
